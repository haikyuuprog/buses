<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Автобусы Нюрнберга</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  </style>
</head>
<body>

<h1>Минут до отправления следующего автобуса</h1>

<table>
  <thead>
    <tr>
      <th>Автобус</th>
      <th>Остановка</th>
      <th>Направление</th>
      <th>Уходит в</th>
      <th>Через</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const buses = [
  {
    line: "65",
    stopId: "341",
    stopName: "Schoppershof (Nürnberg)",
    direction: "Röthenbach"
  },
  {
    line: "65",
    stopId: "365",
    stopName: "Heinemannbrücke (Nürnberg)",
    direction: "Nordostbahnhof"
  },
  {
    line: "37",
    stopId: "353",
    stopName: "Tellstr. (Nürnberg)",
    direction: "Rathaus"
  },
  {
    line: "47",
    stopId: "353",
    stopName: "Tellstr. (Nürnberg)",
    direction: "Rathaus"
  },
  {
    line: "46",
    stopId: "352",
    stopName: "Friedenstr. (Nürnberg)",
    direction: "Rathaus"
  }
];

async function getDeparture(bus) {
  const url =
    `https://start.vag.de/dm/api/v1/abfahrten/VGN/${bus.stopId}` +
    `?product=Bus&timespan=90&limitcount=100`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`Ошибка API: ${response.status}`);
  }

  const data = await response.json();

  const departure = data.Abfahrten.find((item) =>
    item.Linienname === bus.line &&
    item.Richtungstext === bus.direction
  );

  if (!departure) {
    return {
      ...bus,
      time: "Не найдено",
      minutes: "—"
    };
  }

  const departureTime = new Date(
    departure.AbfahrtszeitIst || departure.AbfahrtszeitSoll
  );

  const minutes = Math.max(
    0,
    Math.round((departureTime - Date.now()) / 60000)
  );

  return {
    ...bus,
    time: departureTime.toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    }),
    minutes: `${minutes} мин.`
  };
}

async function updateTable() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";

  for (const bus of buses) {
    const result = await getDeparture(bus);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${result.line}</td>
      <td>${result.stopName}</td>
      <td>${result.direction}</td>
      <td>${result.time}</td>
      <td>${result.minutes}</td>
    `;

    rows.appendChild(row);
  }
}

updateTable();
setInterval(updateTable, 30000);
</script>

</body>
</html>
