<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Автобусы Нюрнберга</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    font-size: 16px;
  }

  h1 {
    font-size: 24px;
  }

  table {
    border-collapse: collapse;
    font-size: 16px;
  }

  th,
  td {
    border: 1px solid #ccc;
    padding: 6px 6px;
    text-align: left;
    vertical-align: top;
  }

	td:last-child {
    text-align: center;
	}

  /* Мобильные экраны: до 900 px */
  @media (max-width: 900px) {
    body {
      font-size: 18px;
    }

    h1 {
      font-size: 22px;
    }

h3 {
      font-size: 18px;
    }

    table {
      font-size: 18px;
    }

    th,
    td {
      padding: 4px 4px;
    }
  }

   }
</style>
</head>
<body>

<h1>Отправление следующего автобуса </h1>
<h3>Страница обновляется автоматически каждые 30 сек.</h1>

<table>
  <thead>
    <tr>
      <th>№</th>
      <th>Остановка >> направление</th>
      <th>Время</th>
      <th>Минуты</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const buses = [
  {
    line: "65",
    stopId: "341",
    stopName: "Schoppershof",
    direction: "Röthenbach"
  },
  {
    line: "65",
    stopId: "365",
    stopName: "Heinemannbrücke",
    direction: "Nordostbahnhof"
  },
  {
    line: "37",
    stopId: "353",
    stopName: "Tellstraße",
    direction: "Rathaus"
  },
  {
    line: "47",
    stopId: "353",
    stopName: "Tellstraße",
    direction: "Rathaus"
  },
  {
    line: "46",
    stopId: "352",
    stopName: "Friedenstraße",
    direction: "Rathaus"
  }
];

async function getDeparture(bus) {
  const url =
    `https://start.vag.de/dm/api/v1/abfahrten/VGN/${bus.stopId}` +
    `?product=Bus&timespan=90&limitcount=100`;

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`Ошибка API: ${response.status}`);
  }

  const data = await response.json();

  const departure = data.Abfahrten.find((item) =>
    item.Linienname === bus.line &&
    item.Richtungstext === bus.direction
  );

  if (!departure) {
    return {
      ...bus,
      time: "Не найдено",
      minutes: "—"
    };
  }

  const departureTime = new Date(
    departure.AbfahrtszeitIst || departure.AbfahrtszeitSoll
  );

  const minutes = Math.max(
    0,
    Math.round((departureTime - Date.now()) / 60000)
  );

  return {
    ...bus,
    time: departureTime.toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    }),
    minutes: minutes
  };
}

async function updateTable() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";

  for (const bus of buses) {
    const result = await getDeparture(bus);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${result.line}</td>
      <td>${result.stopName} &gt;&gt; ${result.direction}</td>
      <td>${result.time}</td>
      <td>${result.minutes}</td>
    `;

    rows.appendChild(row);
  }
}

updateTable();
setInterval(updateTable, 30000);
</script>

</body>
</html>
